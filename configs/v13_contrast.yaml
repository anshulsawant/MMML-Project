model:
  base_model_id: "Qwen/Qwen3-VL-4B-Instruct"
  target_model_id: "Qwen/Qwen3-0.6B"
  max_thought_tokens: 10

experiment:
  name: "v13_contrast"

wandb:
  enabled: false
  project: "LatentEuclid"
  # Leave group/name_prefix blank to use branch-aware env defaults from the launcher:
  #   group       -> ${EXPERIMENT}_${GIT_BRANCH}
  #   name_prefix -> ${EXPERIMENT}_${GIT_BRANCH}_XEncoder
  group: null
  name_prefix: null

# ── Dataset ─────────────────────────────────────────────────────────────────
# JSONL must contain image_path, CoD_steps (list[str]), CoT_text (str),
# and a corresponding problem_<idx>_targets.pt in data.targets_dir.
data:
  jsonl_path: "ChainOfDraft/training_dataset.jsonl"
  targets_dir: "target_tensors"
  targets_hf_repo: "shilinm/latent_euclid"
  targets_hf_prefixes:
    - "target_tensors_v13_contrast/split_20_a"
    - "target_tensors_v13_contrast/split_20_b"
    - "target_tensors_v13_contrast/split_60"

# ── X-Encoder training ──────────────────────────────────────────────────────
train_x_encoder:
  experiment_name: "v13_contrast"
  checkpoint_dir: "checkpoints"

  # Training schedule
  epochs: 100
  batch_size: 16
  gradient_accumulation_steps: 1        # effective batch = 64
  learning_rate: 5.0e-5
  weight_decay: 0.01
  max_grad_norm: 10.0
  augment: false

  # Spatial alignment objective (JEPA / manifold)
  loss_type: "huber_cosine"
  loss_target: "guided"
  vicreg_sim_coeff: 1.0
  vicreg_var_coeff: 1.0
  vicreg_cov_coeff: 0.0

  # Semantic Contrastive Regularization weight (γ · L_InfoNCE)
  # Set to 0.0 to disable contrastive loss and reproduce v12 behaviour.
  gamma: 0.5

  # Validation / checkpointing
  save_every_n_steps: 200
  max_val_samples: 128
  keep_step_checkpoints: 4
  keep_epoch_checkpoints: 4
  save_epoch_checkpoints_after: 7
  use_robust_checkpoint_save: true

  # γ-calibration sanity check: set to true to run a 50-step single-batch overfit
  # test (text-only, no images) before epoch 0. Both Huber and Contrastive losses
  # should reach ≈ 0; if Huber stays high, reduce gamma.
  sanity_check: true

  # HuggingFace Hub upload (leave blank to skip)
  hf_repo: "shilinm/latent_euclid"

# ── Manifold anchor pre-generation ──────────────────────────────────────────
build_manifold:
  batch_size: 4
